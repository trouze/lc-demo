name: dbt Cloud CD (push)

on:
  push:
    branches: [dev, staging, main]

permissions:
  contents: read

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      projects: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve environment
        id: env
        run: |
          case "${{ github.ref_name }}" in
            dev)     echo "environment=development" >> "$GITHUB_OUTPUT" ;;
            staging) echo "environment=staging"     >> "$GITHUB_OUTPUT" ;;
            main)    echo "environment=production"  >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: .github/path-filters.yml

  cd:
    name: CD
    needs: detect
    if: needs.detect.outputs.environment != '' && needs.detect.outputs.projects != '[]'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect.outputs.projects) }}
    uses: ./.github/workflows/_dbt-cloud-run.yml
    with:
      project: ${{ matrix.project }}
      environment: ${{ needs.detect.outputs.environment }}
      mode: cd
      branch: ${{ github.ref_name }}
      cause_suffix: push-${{ github.ref_name }}@${{ github.sha }}
    secrets: inherit

  cd-complete:
    name: dbt Cloud CD
    needs: [detect, cd]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.cd.result }}" == "failure" ]]; then
            echo "::error::One or more dbt Cloud CD jobs failed"
            exit 1
          fi
