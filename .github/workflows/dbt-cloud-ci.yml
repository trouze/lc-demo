name: dbt Cloud CI (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      projects: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve environment
        id: env
        run: |
          case "${{ github.base_ref }}" in
            dev)     echo "environment=development" >> "$GITHUB_OUTPUT" ;;
            staging) echo "environment=staging"     >> "$GITHUB_OUTPUT" ;;
            main)    echo "environment=production"  >> "$GITHUB_OUTPUT" ;;
            *)       echo "environment="            >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: dorny/paths-filter@v3
        id: filter
        if: steps.env.outputs.environment != ''
        with:
          filters: .github/path-filters.yml

  ci:
    name: CI
    needs: detect
    if: needs.detect.outputs.environment != '' && needs.detect.outputs.projects != '[]'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect.outputs.projects) }}
    uses: ./.github/workflows/_dbt-cloud-run.yml
    with:
      project: ${{ matrix.project }}
      environment: ${{ needs.detect.outputs.environment }}
      mode: ci
      branch: ${{ github.head_ref }}
      pr_number: ${{ github.event.pull_request.number }}
      pr_sha: ${{ github.event.pull_request.head.sha }}
    secrets: inherit

  ci-complete:
    name: dbt Cloud CI
    needs: [detect, ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.ci.result }}" == "failure" ]]; then
            echo "::error::One or more dbt Cloud CI jobs failed"
            exit 1
          fi
