# dbt Cloud CI: path filters + matrix (environment × project) → GitHub Environment → dbt Cloud CI jobs.
#
# matrix-prep builds strategy.matrix.include from PR base branch + changed projects (job-level `if`
# cannot use `matrix` — see https://docs.github.com/en/actions/learn-github-actions/contexts#matrix-context).
#
# Each matrix row: environment + project + resolved IDs. Project/job IDs are embedded into the matrix
# rows by matrix-prep so the dbt-cloud-ci job needs no conditional expressions to select them.
#
# PR base branch → environment:
#   dev      → development
#   staging  → staging
#   main     → production
#
# Variable requirements:
#   Repository vars: DBT_ACCOUNT_ID, DBT_URL, DBT_API_KEY (secret)
#   Per GitHub Environment vars: DBT_PROJECT_ID_1, DBT_PROJECT_ID_2, DBT_JOB_CI_1, DBT_JOB_CI_2
#     (environment-scoped so each env targets its own dbt Cloud project + CI job)
#
# Prior art: https://gist.github.com/trouze/26e578d92cd803514f29f6a33d5fd2cd

name: dbt Cloud CI (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: dbt-cloud-ci-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Detect changed dbt projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            project_1:
              - 'first_dbt_project/**'
            project_2:
              - 'second_dbt_project/**'

  # Translate base branch → GitHub Environment name once, so both matrix-prep and
  # dbt-cloud-ci can reference it without duplicating the mapping.
  env-gate:
    name: Resolve target environment
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.projects != '[]'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.map.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - id: map
        env:
          BRANCH_REF: ${{ github.event.pull_request.base.ref }}
        run: python scripts/dbt_cloud/map_environment.py

  # Declares `environment:` to unlock per-env vars (DBT_PROJECT_ID_*, DBT_JOB_CI_*).
  # Resolved IDs are embedded into matrix rows so dbt-cloud-ci needs no conditionals.
  matrix-prep:
    name: Build CI matrix (${{ needs.env-gate.outputs.environment }})
    needs: [changes, env-gate]
    if: needs.changes.result == 'success' && needs.changes.outputs.projects != '[]' && needs.env-gate.outputs.environment != ''
    runs-on: ubuntu-latest
    environment: ${{ needs.env-gate.outputs.environment }}
    outputs:
      matrix_json: ${{ steps.build.outputs.matrix_json }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        env:
          PROJECTS_JSON: ${{ needs.changes.outputs.projects }}
          ENVIRONMENT: ${{ needs.env-gate.outputs.environment }}
          DBT_PROJECT_ID_1: ${{ vars.DBT_PROJECT_ID_1 }}
          DBT_PROJECT_ID_2: ${{ vars.DBT_PROJECT_ID_2 }}
          DBT_JOB_1: ${{ vars.DBT_JOB_CI_1 }}
          DBT_JOB_2: ${{ vars.DBT_JOB_CI_2 }}
        run: python scripts/dbt_cloud/build_matrix.py

  dbt-cloud-ci:
    name: dbt Cloud CI — ${{ matrix.environment }} — ${{ matrix.project }}
    needs: [changes, matrix-prep]
    if: >
      needs.changes.result == 'success' &&
      needs.matrix-prep.result == 'success' &&
      needs.matrix-prep.outputs.matrix_json != '[]'
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix-prep.outputs.matrix_json) }}
    env:
      DBT_URL: ${{ vars.DBT_URL }}
      DBT_ACCOUNT_ID: ${{ vars.DBT_ACCOUNT_ID }}
      DBT_PROJECT_ID: ${{ matrix.dbt_project_id }}
      DBT_PR_JOB_ID: ${{ matrix.dbt_job_id }}
      DBT_API_KEY: ${{ secrets.DBT_API_KEY }}
      DBT_JOB_CAUSE: "github-actions-ci:${{ matrix.environment }}:pr-${{ github.event.pull_request.number }} (${{ matrix.project }})"
      DBT_JOB_BRANCH: ${{ github.head_ref }}
      GH_PULL_REQUEST_ID: ${{ github.event.pull_request.number }}
      DBT_JOB_SCHEMA_OVERRIDE: dbt_cloud_pr_${{ github.event.pull_request.number }}_${{ matrix.project }}
      DBT_RUN_TIMEOUT_SECONDS: "7200"
      DBT_CI_MATRIX_PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: dbt Cloud job (poll) + sticky PR comment
        id: dbt
        run: python scripts/dbt_cloud/call_dbt_job.py
