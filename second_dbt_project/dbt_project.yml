name: 'second_demo'
version: '1.0.0'
config-version: 2

# Profile name is unused when execution happens in dbt Cloud; Cloud uses project connection.
profile: 'sa_databricks'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets:
  - "target"
  - "dbt_packages"

models:
  second_demo:
    +materialized: view
